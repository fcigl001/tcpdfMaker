<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Layout Editor</title>
    <link rel="stylesheet" href="app.css">
</head>
<body>
    <div class="app-container">
        <!-- Header Bar -->
        <header class="app-header">
            <h1>PDF Layout Editor</h1>
            <div class="header-actions">
                <button id="btn-new" class="btn btn-secondary">New</button>
                <button id="btn-import" class="btn btn-secondary">Import JSON</button>
                <button id="btn-export" class="btn btn-primary">Export JSON</button>
            </div>
        </header>

        <div class="main-content">
            <!-- Left Panel: Component Palette -->
            <aside class="panel panel-left">
                <div class="panel-section">
                    <h3>Components</h3>
                    <div class="component-palette">
                        <button class="component-btn" data-type="text" title="Text Block">
                            <span class="icon">T</span>
                            <span>Text</span>
                        </button>
                        <button class="component-btn" data-type="image" title="Image">
                            <span class="icon">🖼</span>
                            <span>Image</span>
                        </button>
                        <button class="component-btn" data-type="line" title="Horizontal Line">
                            <span class="icon">―</span>
                            <span>Line</span>
                        </button>
                        <button class="component-btn" data-type="spacer" title="Spacer">
                            <span class="icon">↕</span>
                            <span>Spacer</span>
                        </button>
                        <button class="component-btn" data-type="columns-2" title="2 Columns">
                            <span class="icon">▯▯</span>
                            <span>2 Columns</span>
                        </button>
                        <button class="component-btn" data-type="columns-3" title="3 Columns">
                            <span class="icon">▯▯▯</span>
                            <span>3 Columns</span>
                        </button>
                        <button class="component-btn" data-type="table" title="Table">
                            <span class="icon">▦</span>
                            <span>Table</span>
                        </button>
                        <button class="component-btn" data-type="pageBreak" title="Page Break">
                            <span class="icon">⎘</span>
                            <span>Page Break</span>
                        </button>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Target Section</h3>
                    <div class="section-selector">
                        <label class="radio-label">
                            <input type="radio" name="target-section" value="header"> Header
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="target-section" value="body" checked> Body
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="target-section" value="footer"> Footer
                        </label>
                    </div>
                </div>

                <div class="panel-section">
                    <h3>Layout Tree</h3>
                    <div id="layout-tree" class="layout-tree"></div>
                </div>
            </aside>

            <!-- Center Panel: Preview -->
            <main class="panel panel-center">
                <div class="preview-toolbar">
                    <span>Preview</span>
                    <select id="preview-zoom">
                        <option value="0.5">50%</option>
                        <option value="0.75">75%</option>
                        <option value="1" selected>100%</option>
                        <option value="1.25">125%</option>
                        <option value="1.5">150%</option>
                        <option value="2">200%</option>
                    </select>
                </div>
                <div class="preview-container">
                    <div id="page-preview" class="page-preview">
                        <div class="preview-header" id="preview-header"></div>
                        <div class="preview-body" id="preview-body"></div>
                        <div class="preview-footer" id="preview-footer"></div>
                    </div>
                </div>
            </main>

            <!-- Right Panel: Properties -->
            <aside class="panel panel-right">
                <div class="tabs">
                    <button class="tab-btn active" data-tab="properties">Properties</button>
                    <button class="tab-btn" data-tab="page">Page</button>
                    <button class="tab-btn" data-tab="styles">Styles</button>
                </div>

                <div id="tab-properties" class="tab-content active">
                    <div id="properties-panel" class="properties-panel">
                        <p class="placeholder-text">Select an element to edit its properties</p>
                    </div>
                </div>

                <div id="tab-page" class="tab-content">
                    <div class="properties-panel">
                        <h4>Document Meta</h4>
                        <div class="form-group">
                            <label>Title</label>
                            <input type="text" id="meta-title" class="form-input">
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="meta-description" class="form-input" rows="2"></textarea>
                        </div>
                        <div class="form-group">
                            <label>Author</label>
                            <input type="text" id="meta-author" class="form-input">
                        </div>

                        <h4>Page Settings</h4>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Size</label>
                                <select id="page-size" class="form-input">
                                    <option value="A4">A4</option>
                                    <option value="Letter">Letter</option>
                                    <option value="Legal">Legal</option>
                                    <option value="A3">A3</option>
                                    <option value="A5">A5</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Orientation</label>
                                <select id="page-orientation" class="form-input">
                                    <option value="P">Portrait</option>
                                    <option value="L">Landscape</option>
                                </select>
                            </div>
                        </div>

                        <h4>Margins (mm)</h4>
                        <div class="form-row four-col">
                            <div class="form-group">
                                <label>Top</label>
                                <input type="number" id="margin-top" class="form-input" min="0">
                            </div>
                            <div class="form-group">
                                <label>Right</label>
                                <input type="number" id="margin-right" class="form-input" min="0">
                            </div>
                            <div class="form-group">
                                <label>Bottom</label>
                                <input type="number" id="margin-bottom" class="form-input" min="0">
                            </div>
                            <div class="form-group">
                                <label>Left</label>
                                <input type="number" id="margin-left" class="form-input" min="0">
                            </div>
                        </div>

                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="auto-page-break">
                                Auto Page Break
                            </label>
                        </div>
                        <div class="form-group">
                            <label>Auto Break Margin</label>
                            <input type="number" id="auto-break-margin" class="form-input" min="0">
                        </div>

                        <h4>Header</h4>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Repeat</label>
                                <select id="header-repeat" class="form-input">
                                    <option value="all">All Pages</option>
                                    <option value="first-only">First Only</option>
                                    <option value="except-first">Except First</option>
                                    <option value="none">None</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Height (mm)</label>
                                <input type="number" id="header-height" class="form-input" min="0">
                            </div>
                        </div>

                        <h4>Footer</h4>
                        <div class="form-row">
                            <div class="form-group">
                                <label>Repeat</label>
                                <select id="footer-repeat" class="form-input">
                                    <option value="all">All Pages</option>
                                    <option value="first-only">First Only</option>
                                    <option value="except-first">Except First</option>
                                    <option value="none">None</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label>Height (mm)</label>
                                <input type="number" id="footer-height" class="form-input" min="0">
                            </div>
                        </div>
                    </div>
                </div>

                <div id="tab-styles" class="tab-content">
                    <div class="properties-panel">
                        <div class="styles-header">
                            <h4>Named Styles</h4>
                            <button id="btn-add-style" class="btn btn-small">+ Add</button>
                        </div>
                        <div id="styles-list" class="styles-list"></div>
                        <div id="style-editor" class="style-editor"></div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <!-- Import/Export Modal -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Modal</h3>
                <button id="modal-close" class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <textarea id="modal-textarea" class="modal-textarea" rows="20"></textarea>
                <div id="modal-error" class="modal-error hidden"></div>
            </div>
            <div class="modal-footer">
                <button id="modal-cancel" class="btn btn-secondary">Cancel</button>
                <button id="modal-confirm" class="btn btn-primary">Confirm</button>
            </div>
        </div>
    </div>

    <!-- Style Editor Modal -->
    <div id="style-modal-overlay" class="modal-overlay hidden">
        <div class="modal">
            <div class="modal-header">
                <h3 id="style-modal-title">Edit Style</h3>
                <button id="style-modal-close" class="modal-close">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>Style Name</label>
                    <input type="text" id="style-name" class="form-input">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Font Family</label>
                        <select id="style-font-family" class="form-input">
                            <option value="helvetica">Helvetica</option>
                            <option value="times">Times</option>
                            <option value="courier">Courier</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Font Size</label>
                        <input type="number" id="style-font-size" class="form-input" min="6" max="72">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Font Style</label>
                        <select id="style-font-style" class="form-input">
                            <option value="">Regular</option>
                            <option value="B">Bold</option>
                            <option value="I">Italic</option>
                            <option value="BI">Bold Italic</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Line Height</label>
                        <input type="number" id="style-line-height" class="form-input" min="0.5" max="3" step="0.1">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Text Color</label>
                        <div class="color-input-group">
                            <input type="color" id="style-text-color" class="form-input-color">
                            <input type="text" id="style-text-color-hex" class="form-input" placeholder="#333333">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Fill Color</label>
                        <div class="color-input-group">
                            <input type="color" id="style-fill-color" class="form-input-color">
                            <input type="text" id="style-fill-color-hex" class="form-input" placeholder="none">
                        </div>
                    </div>
                </div>
                <div class="form-group">
                    <label>Border Color</label>
                    <div class="color-input-group">
                        <input type="color" id="style-border-color" class="form-input-color">
                        <input type="text" id="style-border-color-hex" class="form-input" placeholder="none">
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button id="style-modal-delete" class="btn btn-danger">Delete</button>
                <button id="style-modal-cancel" class="btn btn-secondary">Cancel</button>
                <button id="style-modal-save" class="btn btn-primary">Save</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
